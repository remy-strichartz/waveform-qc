name: tests

# The suite is a synthetic end-to-end regression -- it builds its own waveforms and touches
# no real data, so it needs neither the waveform_files tree nor $WAVEFORM_FILES.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg   # no display on the runner; plotting must not open a window

    steps:
      - uses: actions/checkout@v5

      # waveform-io supplies `hodoscope_common`.  It is a separate PRIVATE repo, so this
      # step needs a token with read access to it: set the WAVEFORM_IO_TOKEN secret to a
      # fine-grained PAT with Contents:Read on remy-strichartz/waveform-io.  The default
      # GITHUB_TOKEN is scoped to THIS repo only and will not work.
      # If waveform-io is ever made public, delete the `token:` line -- nothing else changes.
      - uses: actions/checkout@v5
        with:
          repository: remy-strichartz/waveform-io
          path: .waveform-io
          token: ${{ secrets.WAVEFORM_IO_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
      - run: pip install -e ./.waveform-io

      - name: Record the environment under test
        run: python -c "import numpy,scipy,h5py,matplotlib as m;print('numpy',numpy.__version__);print('scipy',scipy.__version__);print('h5py',h5py.__version__);print('matplotlib',m.__version__)"

      - name: preprocessing
        run: python preprocessing/tests/test_preprocessing.py
